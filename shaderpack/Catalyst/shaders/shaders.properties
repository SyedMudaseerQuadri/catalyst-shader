# Catalyst — Iris shader pack properties.
# Target: Minecraft 1.21.11 / Iris 1.10.7 (docs/release/compatibility.md). Directive names verified
# against the Iris 1.21.11 source (state/evidence/iris_1.10.7_capabilities.md).

# ---- Vanilla behavior Catalyst replaces or keeps -----------------------------------------------
# Catalyst computes its own directional lighting; vanilla's baked face shading would double it.
oldLighting = false
# Vertex color rgb = biome tint, alpha = ambient occlusion, so AO can be applied to indirect light only.
separateAo = true
# Underwater view is handled by Catalyst's medium fog; the vanilla overlay texture is not needed.
underwaterOverlay = false
# No vignette: readability first (docs/visual/aesthetic_direction.md).
vignette = false
sun = true
moon = true
clouds = fancy

# ---- Shadows ----------------------------------------------------------------------------------
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true
program.world0/shadow.enabled = SHADOWS

# ---- Weather state (custom uniforms; Iris smooth(target, up, down): half-lives in 0.1 s units) -----------
# Surfaces get wet only where it actually rains (biome precipitation 1) and dry more slowly than they soak.
# Snow builds up only where it snows (2) and melts more slowly still: different rates, never one snap.
# Note: Iris 1.10.7 maps the drynessHalflife directive onto the wetness half-life (PackDirectives l.283), so this
# pack does not use the built-in `wetness` for surfaces.
uniform.float.weatherWetness = smooth(if(biome_precipitation == 1, rainStrength, 0.0), 300, 1200)
uniform.float.weatherSnowCover = smooth(if(biome_precipitation == 2, rainStrength, 0.0), 600, 1800)
# 1 while the eye is in water (instant), then fades with a ~3 s half-life: drops on the view after surfacing.
uniform.float.viewWetness = smooth(if(isEyeInWater == 1, 1.0, 0.0), 0, 30)

# ---- Temporal anti-aliasing (composite1 in every dimension) ----------------------------------------
program.world0/composite1.enabled = TAA
program.world-1/composite1.enabled = TAA
program.world1/composite1.enabled = TAA

# ---- Performance presets (Layer 1, docs/architecture/preset_model.md) ---------------------------
# Selected with the Iris "Profile" button. Balanced equals the source defaults.
# Minimum hardware target (D-006): Performance must be playable at 1080p on an RTX 3050 8GB.
profile.PERFORMANCE = PERF_PROFILE=0 shadowMapResolution=1024 shadowDistance=80.0 SHADOW_FILTER=1
profile.BALANCED    = PERF_PROFILE=1 shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=2
profile.QUALITY     = PERF_PROFILE=2 shadowMapResolution=2048 shadowDistance=160.0 SHADOW_FILTER=3
profile.ULTRA       = PERF_PROFILE=3 shadowMapResolution=3072 shadowDistance=192.0 SHADOW_FILTER=3
profile.CINEMATIC   = PERF_PROFILE=4 shadowMapResolution=4096 shadowDistance=256.0 SHADOW_FILTER=3

# ---- Settings menu (settings_architecture.md: preset selectors first, then subsystem groups) ----
screen = <profile> VISUAL_PRESET <empty> <empty> [LIGHTING] [SHADOWS_SCREEN] [MATERIALS] [ATMOSPHERE] [WEATHER] [WATER] [COLOR] [IMAGE] [DEBUG]
screen.columns = 2

screen.LIGHTING = SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY EMISSIVE_INTENSITY NIGHT_VISIBILITY
screen.SHADOWS_SCREEN = SHADOWS <empty> shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS sunPathRotation
screen.MATERIALS = MATERIAL_MAPS SPECULAR_INTENSITY
screen.ATMOSPHERE = FOG_DENSITY <empty> CLOUD_STYLE CLOUD_COVERAGE CLOUD_SHADOW_STRENGTH
screen.WEATHER = WEATHER_WETNESS SNOW_ACCUMULATION FOLIAGE_MOTION
screen.WATER = WATER_WAVE_STRENGTH WATER_TURBIDITY CAUSTICS_STRENGTH WATER_REFLECTIONS UNDERWATER_SHAFTS VIEW_DROPLETS
screen.COLOR = EXPOSURE_BIAS EXPOSURE_ADAPTATION SATURATION CONTRAST
screen.IMAGE = TAA
screen.DEBUG = DEBUG_VIEW

sliders = SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY EMISSIVE_INTENSITY NIGHT_VISIBILITY \
          shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation \
          SPECULAR_INTENSITY FOG_DENSITY CLOUD_COVERAGE CLOUD_SHADOW_STRENGTH \
          WEATHER_WETNESS SNOW_ACCUMULATION FOLIAGE_MOTION \
          WATER_WAVE_STRENGTH WATER_TURBIDITY CAUSTICS_STRENGTH EXPOSURE_BIAS EXPOSURE_ADAPTATION SATURATION CONTRAST
