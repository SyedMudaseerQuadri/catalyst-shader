# Catalyst — Iris shader pack properties.
# Target: Minecraft 1.21.11 / Iris 1.10.7 (docs/release/compatibility.md). Directive names verified
# against the Iris 1.21.11 source (state/evidence/iris_1.10.7_capabilities.md).

# ---- Vanilla behavior Catalyst replaces or keeps -----------------------------------------------
# Catalyst computes its own directional lighting; vanilla's baked face shading would double it.
oldLighting = false
# Vertex color rgb = biome tint, alpha = ambient occlusion, so AO can be applied to indirect light only.
separateAo = true
# Underwater view is handled by Catalyst's medium fog; the vanilla overlay texture is not needed.
underwaterOverlay = false
# No vignette: readability first (docs/visual/aesthetic_direction.md).
vignette = false
sun = true
moon = true
clouds = fancy

# ---- Shadows ----------------------------------------------------------------------------------
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true
program.world0/shadow.enabled = SHADOWS

# ---- Performance presets (Layer 1, docs/architecture/preset_model.md) ---------------------------
# Selected with the Iris "Profile" button. Balanced equals the source defaults.
# Minimum hardware target (D-006): Performance must be playable at 1080p on an RTX 3050 8GB.
profile.PERFORMANCE = PERF_PROFILE=0 shadowMapResolution=1024 shadowDistance=80.0 SHADOW_FILTER=1
profile.BALANCED    = PERF_PROFILE=1 shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=2
profile.QUALITY     = PERF_PROFILE=2 shadowMapResolution=2048 shadowDistance=160.0 SHADOW_FILTER=3
profile.ULTRA       = PERF_PROFILE=3 shadowMapResolution=3072 shadowDistance=192.0 SHADOW_FILTER=3
profile.CINEMATIC   = PERF_PROFILE=4 shadowMapResolution=4096 shadowDistance=256.0 SHADOW_FILTER=3

# ---- Settings menu (settings_architecture.md: preset selectors first, then subsystem groups) ----
screen = <profile> VISUAL_PRESET <empty> <empty> [LIGHTING] [SHADOWS_SCREEN] [ATMOSPHERE] [COLOR] <empty> <empty> [DEBUG]
screen.columns = 2

screen.LIGHTING = SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY EMISSIVE_INTENSITY NIGHT_VISIBILITY
screen.SHADOWS_SCREEN = SHADOWS <empty> shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS sunPathRotation
screen.ATMOSPHERE = FOG_DENSITY
screen.COLOR = EXPOSURE_BIAS SATURATION CONTRAST
screen.DEBUG = DEBUG_VIEW

sliders = SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY EMISSIVE_INTENSITY NIGHT_VISIBILITY \
          shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation \
          FOG_DENSITY EXPOSURE_BIAS SATURATION CONTRAST
